<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">
<title>FileDock 产品功能示意</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12232c"/><stop offset=".52" stop-color="#0e1720"/><stop offset="1" stop-color="#090f16"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#249b8d" stop-opacity=".30"/><stop offset="1" stop-color="#249b8d" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20353f" stop-opacity=".95"/><stop offset=".48" stop-color="#19252e" stop-opacity=".97"/><stop offset="1" stop-color="#17212a"/></linearGradient>
 <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#91d9f5"/><stop offset="1" stop-color="#44b8e6"/></linearGradient>
 <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65c7ef"/><stop offset="1" stop-color="#32a8d6"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d303b"/><stop offset="1" stop-color="#16212b"/></linearGradient>
 <linearGradient id="tealCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d4c4c"/><stop offset="1" stop-color="#192b36"/></linearGradient>
 <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".38"/></filter>
</defs><rect x="0" y="0" width="1200" height="500" rx="24" fill="url(#bg)"/><ellipse cx="432.0" cy="250.0" rx="744.0" ry="400.0" fill="url(#glow)"/><text x="48" y="43" fill="#54e0c4" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="13" font-weight="600" text-anchor="start" letter-spacing="2">COLLECT → ORGANIZE</text><text x="48" y="93" fill="#edf4f8" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="33" font-weight="600" text-anchor="start">先接住文件，再决定放在哪里。</text><text x="48" y="128" fill="#9baebd" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="18" font-weight="400" text-anchor="start">跨文件夹收集，集中查看，一次转移到目标位置。</text><rect x="48" y="164" width="300" height="260" rx="20" fill="url(#card)" stroke="#344955" stroke-width="1"/><text x="72" y="202" fill="#edf4f8" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="22" font-weight="500" text-anchor="start">01  随手收集</text><rect x="438" y="164" width="324" height="260" rx="20" fill="url(#tealCard)" stroke="#497675" stroke-width="1"/><text x="462" y="202" fill="#54e0c4" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="22" font-weight="500" text-anchor="start">02  暂存一下</text><rect x="852" y="164" width="300" height="260" rx="20" fill="url(#card)" stroke="#344955" stroke-width="1"/><text x="876" y="202" fill="#edf4f8" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="22" font-weight="500" text-anchor="start">03  从容归位</text><g transform="translate(75 228) scale(0.4722222222222222 0.5)"><path d="M2 11Q2 5 8 5H27L34 12H65Q70 12 70 18V51Q70 56 65 56H7Q2 56 2 51Z" fill="url(#folderBack)"/><path d="M2 19Q2 14 8 14H65Q70 14 70 20V51Q70 56 65 56H7Q2 56 2 51Z" fill="url(#folderFront)"/><path d="M8 16H64" fill="none" stroke="#b0ebfb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/></g><text x="126" y="253" fill="#bfced8" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="18" font-weight="400" text-anchor="start">设计素材</text><g transform="translate(78 284) scale(1.0416666666666667)" fill="none" stroke="#a9d4d2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h10l5 5v15H5zM15 2v6h5M8 12h9M8 16h9"/></g><text x="126" y="306" fill="#bfced8" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="18" font-weight="400" text-anchor="start">会议笔记.md</text><g transform="translate(78 337) scale(1.0416666666666667)" fill="none" stroke="#a9d4d2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h10l5 5v15H5zM15 2v6h5M8 12h9M8 16h9"/></g><text x="126" y="359" fill="#bfced8" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="18" font-weight="400" text-anchor="start">参考图片.png</text><g transform="translate(372 278) scale(1.5)" fill="none" stroke="#54e0c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M15 6l6 6-6 6"/></g><g transform="translate(786 278) scale(1.5)" fill="none" stroke="#54e0c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M15 6l6 6-6 6"/></g><rect x="464" y="223" width="272" height="143" rx="14" fill="#0d2028" opacity="0.6"/><g transform="translate(488 247) scale(2.0)" fill="none" stroke="#54e0c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l3 10v6H1v-6z"/><path d="M1 15h6l2 3h6l2-3h6"/></g><text x="553" y="265" fill="#edf4f8" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="23" font-weight="500" text-anchor="start">3 个项目</text><text x="553" y="295" fill="#99b8bf" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="16" font-weight="400" text-anchor="start">文件与文件夹</text><text x="600" y="344" fill="#bad1d7" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="17" font-weight="400" text-anchor="middle">留在手边，等你整理</text><text x="600" y="397" fill="#9dbdc2" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="16" font-weight="400" text-anchor="middle">拖入 / 右键加入 / 拖出使用</text><g transform="translate(879 236) scale(0.6527777777777778 0.6551724137931034)"><path d="M2 11Q2 5 8 5H27L34 12H65Q70 12 70 18V51Q70 56 65 56H7Q2 56 2 51Z" fill="url(#folderBack)"/><path d="M2 19Q2 14 8 14H65Q70 14 70 20V51Q70 56 65 56H7Q2 56 2 51Z" fill="url(#folderFront)"/><path d="M8 16H64" fill="none" stroke="#b0ebfb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/></g><text x="943" y="263" fill="#edf4f8" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="21" font-weight="500" text-anchor="start">项目归档</text><rect x="879" y="296" width="246" height="40" rx="10" fill="#4bdfc2"/><text x="1002" y="323" fill="#0e302e" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="18" font-weight="600" text-anchor="middle">复制到文件夹…</text><rect x="879" y="349" width="246" height="40" rx="10" fill="#273c46"/><text x="1002" y="376" fill="#c6d9e1" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="18" font-weight="500" text-anchor="middle">移动到文件夹…</text><text x="48" y="465" fill="#a3b9c4" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="17" font-weight="400" text-anchor="start">本地文件以引用暂存，清空列表不会删除原文件。</text><text x="1152" y="465" fill="#6a8595" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="14" font-weight="400" text-anchor="end">流程示意</text></svg>
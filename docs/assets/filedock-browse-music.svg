</defs><rect x="0" y="0" width="1200" height="566" rx="24" fill="url(#bg)"/><ellipse cx="432.0" cy="283.0" rx="744.0" ry="452.8" fill="url(#glow)"/><text x="48" y="43" fill="#54e0c4" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="13" font-weight="600" text-anchor="start" letter-spacing="2">READ &amp; LISTEN</text><text x="48" y="93" fill="#edf4f8" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="32" font-weight="600" text-anchor="start">浏览时少一次打开，专注时少一次切换。</text><text x="48" y="128" fill="#9baebd" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="18" font-weight="400" text-anchor="start">分栏直接预览文档；刘海嵌入模式，把音乐留在顶栏中央。</text><g filter="url(#shadow)"><rect x="48" y="163" width="704" height="330" rx="18" fill="url(#glass)" stroke="#3c5662" stroke-width="1"/></g><text x="71" y="199" fill="#bcced7" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="18" font-weight="500" text-anchor="start">项目资料</text><g transform="translate(709 179) scale(0.9166666666666666)" fill="none" stroke="#54e0c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M9 4v16M16 4v16"/></g><path d="M49 216H751" stroke="#ffffff" opacity="0.1" stroke-width="1"/><path d="M280 217L280 492" stroke="#ffffff" opacity="0.1" stroke-width="1"/><g transform="translate(76 242) scale(0.9166666666666666)" fill="none" stroke="#8aa8ba" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h6l2 2h10v11H3z"/><path d="M3 7V5h6l2 2h10v2"/></g><text x="109" y="261" fill="#a7bdca" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="17" font-weight="400" text-anchor="start">设计素材</text><g transform="translate(76 293) scale(0.9166666666666666)" fill="none" stroke="#8aa8ba" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h6l2 2h10v11H3z"/><path d="M3 7V5h6l2 2h10v2"/></g><text x="109" y="312" fill="#a7bdca" font-family="PingFang S